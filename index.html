<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { text-align: center; color: purple; font-family: sans-serif; }
        .loader { width: 300px; height: 4px; background: #333; margin: 20px auto; border-radius: 2px; }
        #fill { width: 0%; height: 100%; background: purple; transition: width 3s linear; }
    </style>
</head>
<body>

    <div class="container">
        <h1>PRIME MOTEL SIMULATOR</h1>
        <div class="loader"><div id="fill"></div></div>
    </div>

    <script>
        // 1. Loading bar shuru karo
        setTimeout(() => { document.getElementById('fill').style.width = '100%'; }, 100);

        // 2. 3 second pachi bija page par mokli do
        setTimeout(() => {
            window.location.href = ' simulator.html'; // Aa file nu naam chhe jya tmare javu chhe
        }, 3000);
    </script>
</body>
</html>
